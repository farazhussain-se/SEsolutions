<script>
    // --- Language detection (per widgets/MULTILANGUAGE.md) ---
    const LANG = (() => {
        const l = navigator.language || '';
        if (l.startsWith('de')) return 'de';
        if (l.startsWith('fr')) return 'fr';
        if (l.startsWith('es')) return 'es';
        if (l.startsWith('ja')) return 'ja';
        if (l === 'en-GB')      return 'en-GB';
        return 'en-US';
    })();
    document.documentElement.lang = LANG;

    const LOCALE = {
        'de': 'de-DE', 'fr': 'fr-FR', 'es': 'es-ES',
        'ja': 'ja-JP', 'en-GB': 'en-GB', 'en-US': 'en-US'
    }[LANG];
    const HOUR12 = LANG === 'en-GB' || LANG === 'en-US';

    // --- Translations ---
    const T = {
        de: {
            title: "Communities",
            description: "Tritt Communities bei, folge Gesprächen und vernetze dich mit Kolleginnen und Kollegen.",

                '1. フィードで自己紹介しましょう。\n2. 「イベント」タブで次のチームハドルを確認しましょう。\n3. 「ファイル」から開店チェックリストを入手しましょう。') }] : [];
        c.removed = new Set();

    // --- State ---
    const state = { calMonth: 0, calDay: null, creating: false, view: 'list', cat: 'all', q: '', cid: null, feedFilter: 'all', day: null, mq: '' };
    const liked = new Set(), saved = new Set(), followed = new Set(), rsvps = new Set(), voted = {}, openComments = new Set();
    const seed = { n: 1 };

    // --- Helpers ---
    const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const cById = id => COMMUNITIES.find(c => c.id === id);
    const memberCount = c => c.baseMembers + (c.joined ? 1 : 0) - c.removed.size;
    const initials = n => n.split(' ').map(p => p[0]).slice(0, 2).join('');
    const hueOf = n => { let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
    const AV = ['#343434', '#5277AB', '#477F33', '#8A6D4B', '#707070', '#2F5F8F'];
    const avatar = (n, sm) => `<div class="cw-avatar${sm ? ' cw-sm' : ''}" style="background:${AV[hueOf(n) % AV.length]}" aria-hidden="true">${esc(initials(n))}</div>`;
    const coverBg = c => GRADS[c.grad] || GRADS.g1;
    const roleOf = (idx) => idx === 0 ? 'roleAdmin' : idx === 1 ? 'roleMod' : 'roleMember';
    const postText = p => p.key ? tr(p.key, { c: loc(cById(state.cid), 'name') }) : loc(p, 'text');
    const eventTitle = (e, c) => e.key ? tr(e.key, { c: loc(c, 'name') }) : loc(e, 'title');
    const eventDate = e => daysFromNow(e.day, e.h, e.min);

    let toastTimer;
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }
    function copyText(s) {
        try { navigator.clipboard && navigator.clipboard.writeText(s).catch(() => {}); } catch (e) { /* ignore */ }
    }

    // --- List view ---
    function listResults() {
        const q = state.q.trim().toLowerCase();
        const match = c => (state.cat === 'all' || c.cat === state.cat) &&
            (!q || (loc(c, 'name') + ' ' + loc(c, 'desc')).toLowerCase().includes(q));
        const mine = COMMUNITIES.filter(c => c.joined && match(c));
        const other = COMMUNITIES.filter(c => !c.joined && match(c));
        if (!mine.length && !other.length) return `<div class="hub-empty">${t.noResults}</div>`;
        const card = c => `
            <div class="cw-card comm-card" data-act="open" data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(loc(c, 'name'))}">
                <div class="comm-cover" style="background:${coverBg(c)}"><div class="comm-icon">${c.icon}</div></div>
                <div class="comm-body">
                    <h3>${esc(loc(c, 'name'))}</h3>
                    <p>${esc(loc(c, 'desc'))}</p>
                    <div class="comm-foot">
                        <span class="cw-muted">${tr('members', { n: numFmt.format(memberCount(c)) })}</span>
                        <button class="cw-btn cw-sm ${c.joined ? 'cw-outline' : ''}" data-act="toggleJoin" data-id="${c.id}">${c.joined ? '✓ ' + t.joined : t.join}</button>
                    </div>
                </div>
            </div>`;
        return (mine.length ? `<h3 class="hub-section">${t.myCommunities}</h3><div class="hub-grid">${mine.map(card).join('')}</div>` : '') +
               (other.length ? `<h3 class="hub-section">${t.discover}</h3><div class="hub-grid">${other.map(card).join('')}</div>` : '');
    }

    function renderList() {
        const cats = [['all', 'catAll'], ['work', 'catWork'], ['wellbeing', 'catWellbeing'], ['culture', 'catCulture']];
        return `

                <p class="hub-eyebrow">${t.title}</p>
                <h2>${t.heroTitle}</h2>

                <div class="hub-searchrow">
                    <div class="hub-search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input id="q" type="search" value="${esc(state.q)}" placeholder="${esc(t.search)}" aria-label="${esc(t.search)}">

            </section>
            <div class="hub-tools">
                <div class="hub-chips">${cats.map(([k, lbl]) => `<button class="cw-chip ${state.cat === k ? 'cw-active' : ''}" data-act="cat" data-v="${k}">${t[lbl]}</button>`).join('')}</div>
            </div>
            <div id="results">${listResults()}</div>`;
    }

    // --- Detail view ---
    function renderPost(p, c) {
        const isLiked = liked.has(p.id), isSaved = saved.has(p.id), isOpen = openComments.has(p.id);
        const likeCount = p.likes + (isLiked ? 1 : 0);
        let poll = '';
        if (p.poll) {
            const total = p.poll.reduce((s, o) => s + o.votes, 0) + (voted[p.id] !== undefined ? 1 : 0);
            poll = p.poll.map((o, i) => {
                const v = o.votes + (voted[p.id] === i ? 1 : 0);
                const pct = Math.round(v / total * 100);
                return `<button class="poll-opt ${voted[p.id] === i ? 'cw-mine' : ''}" data-act="vote" data-id="${p.id}" data-i="${i}" ${voted[p.id] !== undefined ? 'disabled' : ''}>
                    <span class="poll-fill" style="width:${voted[p.id] !== undefined ? pct : 0}%"></span>
                    <span class="poll-row"><span>${esc(loc(o, 'label'))}</span><span>${voted[p.id] !== undefined ? pct + '%' : ''}</span></span></button>`;
            }).join('') + `<div class="cw-muted" style="margin-bottom:10px">${tr('votes', { n: numFmt.format(total) })}</div>`;
        }
        const comments = isOpen ? `
            <div class="comments">
                ${p.comments.map(cm => `<div class="comment">${avatar(cm.a, true)}<div class="comment-bubble"><b>${esc(cm.a)}</b>${esc(cm.text ?? t[cm.k])}</div></div>`).join('')}
                ${c.joined ? `<div class="comment-form"><input class="cw-input" id="ci-${p.id}" data-id="${p.id}" placeholder="${esc(t.writeComment)}"><button class="cw-btn" data-act="sendComment" data-id="${p.id}">${t.send}</button></div>`
                           : `<div class="cw-muted">${t.joinToPost}</div>`}
            </div>` : '';
        return `
            <article class="cw-card post">
                <div class="post-head">${avatar(p.author)}
                    <div class="who"><b>${esc(p.author)}</b><span class="cw-muted">${rel(p.ts)}</span></div>
                    ${p.pinned ? `<span class="cw-badge cw-primary">📌 ${t.pinned}</span>` : ''}
                    ${p.type === 'announcement' && !p.pinned ? `<span class="cw-badge">📣 ${t.fAnnouncements}</span>` : ''}
                </div>
                <p class="post-text">${esc(postText(p))}</p>
                ${poll}
                <div class="post-actions">
                    <button class="act-btn ${isLiked ? 'cw-on' : ''}" data-act="like" data-id="${p.id}">${isLiked ? '👍' : '👍🏻'} ${t.like} · ${likeCount}</button>
                    <button class="act-btn ${isOpen ? 'cw-on' : ''}" data-act="toggleComments" data-id="${p.id}">💬 ${tr('comments', { n: p.comments.length })}</button>
                    <button class="act-btn" data-act="share" data-id="${p.id}">↗ ${t.share}</button>
                    <button class="act-btn ${isSaved ? 'cw-on' : ''}" data-act="save" data-id="${p.id}">${isSaved ? '🔖 ' + t.saved : '🔖 ' + t.save}</button>
                    ${c.manager ? `<button class="act-btn" data-act="pin" data-id="${p.id}">📌 ${p.pinned ? t.unpinPost : t.pinPost}</button><button class="act-btn" data-act="delPost" data-id="${p.id}" style="color:var(--danger)">🗑 ${t.deleteBtn}</button>` : ''}
                </div>
                ${comments}
            </article>`;
    }

    function feedHtml(c) {
        const filters = [['all', 'fAll'], ['announcement', 'fAnnouncements'], ['discussion', 'fDiscussions'], ['poll', 'fPolls']];
        let posts = c.posts.filter(p => state.feedFilter === 'all' || p.type === state.feedFilter);
        posts = posts.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.ts - a.ts);
        const shown = posts.slice(0, c.visible);
        const composer = c.joined ? `
            <div class="cw-card composer">
                <div style="display:flex;gap:10px">${avatar(ME)}<textarea class="cw-input" id="composer" placeholder="${esc(t.composerPlaceholder)}"></textarea></div>
                <div class="composer-foot"><button class="cw-btn" data-act="publish">${t.post}</button></div>
            </div>` : `
            <div class="cw-card join-banner"><span>${t.joinToPost}</span><button class="cw-btn" data-act="toggleJoin" data-id="${c.id}">${t.join}</button></div>`;
        return `
            ${composer}
            <div class="feed-filters">${filters.map(([k, lbl]) => `<button class="cw-chip ${state.feedFilter === k ? 'cw-active' : ''}" data-act="feedFilter" data-v="${k}">${t[lbl]}</button>`).join('')}</div>
            ${shown.length ? shown.map(p => renderPost(p, c)).join('') : `<div class="hub-empty">${t.noPosts}</div>`}
            ${posts.length > shown.length ? `<div class="more-wrap"><button class="cw-btn cw-outline" data-act="showMore">${t.showMore}</button></div>` : ''}`;
    }

    const EV_COLORS = ['#5277AB', '#477F33', '#343434', '#8A6D4B', '#3AA6EF', '#9B2C2C'];
    const evColor = (c, e) => EV_COLORS[Math.max(0, c.events.indexOf(e)) % EV_COLORS.length];
    const calKey = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    function calendarHtml(c) {
        const base = new Date(now.getFullYear(), now.getMonth() + state.calMonth, 1);
        const firstDow = (LANG === 'en-US' || LANG === 'ja') ? 0 : 1;
        const lead = (base.getDay() - firstDow + 7) % 7;
        const dim = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
        const byDay = {};
        c.events.forEach(e => { const k = calKey(eventDate(e)); (byDay[k] = byDay[k] || []).push(e); });
        const wdFmt = new Intl.DateTimeFormat(LOCALE, { weekday: 'narrow' });
        const heads = Array.from({ length: 7 }, (_, i) => `<div class="cal-wd">${wdFmt.format(new Date(2024, 0, 7 + firstDow + i))}</div>`).join('');
        let cells = '<span></span>'.repeat(lead);
        for (let d = 1; d <= dim; d++) {
            const k = calKey(new Date(base.getFullYear(), base.getMonth(), d));
            const evs = byDay[k] || [], dow = new Date(base.getFullYear(), base.getMonth(), d).getDay();
            const tint = evs.length ? ` style="background:color-mix(in srgb, ${evColor(c, evs[0])} 18%, var(--bg))"` : '';
            cells += `<button class="cal-day ${evs.length ? 'cw-ev' : ''} ${dow === 0 || dow === 6 ? 'cw-wknd' : ''} ${k === calKey(now) ? 'cw-today' : ''} ${state.calDay === k ? 'cw-active' : ''}" data-act="calDay" data-k="${k}"${tint}>${d}${evs.length ? `<span class="cal-dots">${evs.map(e => `<i class="cal-dot" style="background:${evColor(c, e)}"></i>`).join('')}</span>` : ''}</button>`;
        }
        let list, heading;
        if (state.calDay) {
            const [y, mo, d] = state.calDay.split('-').map(Number);
            heading = new Intl.DateTimeFormat(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(y, mo, d));
            list = byDay[state.calDay] || [];
        } else {
            heading = t.upcoming;
            list = c.events.slice().sort((a, b) => eventDate(a) - eventDate(b)).slice(0, 3);
        }
        const rows = list.length ? list.map(e => {
            const dt = eventDate(e);
            return `<button class="cal-ev" data-act="calEvent" data-id="${e.id}" style="--ev:${evColor(c, e)}">
                <div class="cal-ev-date"><small>${monthShortFmt.format(dt)}</small><b>${dt.getDate()}</b></div>
                <div class="cal-ev-info"><b>${esc(eventTitle(e, c))}</b><span class="cw-muted">${timeFmt.format(dt)} · ${e.locText ? esc(e.locText) : t[e.loc]}</span></div></button>`;
        }).join('') : `<div class="cw-muted" style="padding:6px 0">${t.noEvents}</div>`;
        return `
            <div class="cw-card cal-card">
                <div class="cal-head">
                    <button class="cal-nav" data-act="calNav" data-v="-1" aria-label="${esc(t.prevMonth)}">‹</button>
                    <h4>${monthYearFmt.format(base)}</h4>
                    <button class="cal-nav" data-act="calNav" data-v="1" aria-label="${esc(t.nextMonth)}">›</button>
                </div>
                <div class="cal-grid">${heads}${cells}</div>
                <div class="cal-list-h">${esc(heading)}</div>
                ${rows}
                <button class="cal-link" data-act="goEvents">${t.viewAll} →</button>
            </div>`;
    }

    function sideHtml(c) {
        const people = PEOPLE.slice(0, 3);
        return `
            <div class="cw-card side-card">
                <h4>${t.aboutTitle}</h4>
                <p class="cw-muted" style="margin:0 0 8px">${esc(loc(c, 'desc'))}</p>
                <div class="cw-muted">${t.visibility}</div>
            </div>
            ${calendarHtml(c)}
            <div class="cw-card side-card">

    function aboutHtml(c) {
        return `
            <div class="cw-card about-card">
                <h3>${t.aboutTitle}</h3>
                <p>${esc(loc(c, 'desc'))}</p>
                <p class="cw-muted">${tr('created', { d: monthYearFmt.format(daysAgo(c.createdDaysAgo)) })} · ${t.visibility}</p>
                <div style="display:flex;gap:8px;flex-wrap:wrap">

                    ${c.joined ? `<button class="cw-btn cw-ghost" data-act="toggleJoin" data-id="${c.id}">${t.leave}</button>` : `<button class="cw-btn" data-act="toggleJoin" data-id="${c.id}">${t.join}</button>`}
                </div>
            </div>
            <div class="cw-card about-card"><h3>${t.rules}</h3><ul><li>${t.rule1}</li><li>${t.rule2}</li><li>${t.rule3}</li></ul></div>
            <div class="cw-card about-card"><h3>${t.admins}</h3>
                ${PEOPLE.slice(0, 2).map(n => `<div class="side-row">${avatar(n, true)}<span>${esc(n)}</span><span class="cw-badge">${t.roleAdmin}</span></div>`).join('')}
            </div>`;
    }

    function membersListHtml(c) {
        const q = state.mq.trim().toLowerCase();
        const list = [];
        if (c.joined) list.push({ n: ME, role: 'roleMember', me: true });
        PEOPLE.forEach((n, i) => { if (!c.removed.has(n)) list.push({ n, role: roleOf(i) }); });
        const rows = list.filter(x => !q || x.n.toLowerCase().includes(q));
        if (!rows.length) return `<div class="hub-empty">${t.noResults}</div>`;
        return rows.map(x => `
            <div class="cw-card member">${avatar(x.n)}
                <div class="member-info"><b>${esc(x.n)}</b> <span class="cw-badge">${x.me ? t.you : t[x.role]}</span></div>
                ${x.me ? '' : `<div class="member-btns">
                    <button class="cw-btn cw-sm ${followed.has(x.n) ? 'cw-ghost cw-on' : 'cw-outline'}" data-act="follow" data-n="${esc(x.n)}">${followed.has(x.n) ? '✓ ' + t.following : t.follow}</button>
                    <button class="cw-btn cw-sm cw-ghost" data-act="msg" data-n="${esc(x.n)}">${t.message}</button>
                    ${c.manager ? `<button class="cw-btn cw-sm cw-danger" data-act="removeMember" data-n="${esc(x.n)}">${t.removeBtn}</button>` : ''}</div>`}
            </div>`).join('');
    }
    function membersHtml(c) {
        return `<input class="cw-input" id="mq" type="search" style="margin-bottom:12px" value="${esc(state.mq)}" placeholder="${esc(t.searchMembers)}">
                <div id="mlist">${membersListHtml(c)}</div>`;
    }

    function eventsHtml(c) {
        const days = Array.from({ length: 7 }, (_, i) => i);
        const evs = c.events.slice().sort((a, b) => eventDate(a) - eventDate(b));
        const shown = evs.filter(e => state.day === null || e.day === state.day);
        const strip = days.map(d => {
            const dt = daysFromNow(d);
            return `<button class="day-btn ${state.day === d ? 'cw-active' : ''}" data-act="day" data-v="${d}" aria-pressed="${state.day === d}">
                <small>${weekdayShortFmt.format(dt)}</small><b>${dt.getDate()}</b>${evs.some(e => e.day === d) ? '<div class="day-dot"></div>' : '<div style="height:9px"></div>'}</button>`;
        }).join('');
        return `
            <div class="week-strip">${strip}</div>
            ${state.day !== null ? `<div style="margin-bottom:10px"><button class="cw-chip" data-act="day" data-v="all">✕ ${t.allDays}</button></div>` : ''}
            ${shown.length ? shown.map(e => {
                const dt = eventDate(e), end = new Date(dt.getTime() + e.dur * 60000), on = rsvps.has(e.id);
                return `<div class="cw-card event" style="--ev:${evColor(c, e)}">
                    <div class="event-date"><small>${monthShortFmt.format(dt)}</small><b>${dt.getDate()}</b></div>
                    <div class="event-info"><h4>${esc(eventTitle(e, c))}</h4>
                        <div class="cw-muted">${timeFmt.format(dt)} – ${timeFmt.format(end)} · ${e.locText ? esc(e.locText) : t[e.loc]}</div>
                        <div class="cw-muted">${tr('attendees', { n: numFmt.format(e.going + (on ? 1 : 0)) })}</div></div>
                    <button class="cw-btn ${on ? 'cw-outline' : ''}" data-act="rsvp" data-id="${e.id}">${on ? '✓ ' + t.going : t.rsvp}</button>
                </div>`;
            }).join('') : `<div class="hub-empty">${t.noEvents}</div>`}`;
    }

    function filesHtml(c) {
        return c.files.map(f => `
            <div class="cw-card file"><div class="file-ico">${f.ico}</div>
                <div class="file-info"><b>${esc(f.n)}</b><span class="cw-muted">${f.s} · ${esc(f.by)} · ${rel(daysAgo(f.d))}</span></div>
                <button class="cw-btn cw-sm cw-outline" data-act="download" data-f="${esc(f.n)}">⬇ ${t.download}</button>
            </div>`).join('');
    }

    function pageHtml(c) {
        const pg = c.pages.find(x => 'page:' + x.id === c.tab);
        return `<div class="cw-card about-card"><h3>${esc(loc(pg, 'title'))}</h3><p style="white-space:pre-wrap">${esc(loc(pg, 'body'))}</p>
            ${c.manager ? `<button class="cw-btn cw-danger cw-sm" data-act="delPage" data-id="${pg.id}">🗑 ${t.deleteBtn}</button>` : ''}</div>`;
    }

    function settingsHtml(c) {
        if (!c.manager) return `
            <div class="cw-card about-card"><h3>⚙ ${t.managerTitle}</h3><p>${t.managerHint}</p>
                <button class="cw-btn" data-act="toggleManager">${t.managerEnter}</button></div>`;
        const dayFmt = new Intl.DateTimeFormat(LOCALE, { weekday: 'short', day: 'numeric', month: 'short' });
        const dayOpts = Array.from({ length: 7 }, (_, d) => `<option value="${d}">${dayFmt.format(daysFromNow(d))}</option>`).join('');
        const evs = c.events.slice().sort((a, b) => eventDate(a) - eventDate(b));
        return `
            <div class="cw-card about-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <h3 style="margin:0">⚙ ${t.managerTitle} <span class="cw-badge cw-primary">${t.managerBadge}</span></h3>
                <button class="cw-btn cw-ghost cw-sm" data-act="toggleManager">${t.managerExit}</button></div></div>

            <div class="cw-card about-card"><h3>${t.detailsTitle}</h3>
                <div class="set-form">
                    <label>${t.nameLbl}<input class="cw-input" id="sName" maxlength="40" value="${esc(loc(c, 'name'))}"></label>
                    <label>${t.descLbl}<textarea class="cw-input" id="sDesc">${esc(loc(c, 'desc'))}</textarea></label>
                    <div><button class="cw-btn" data-act="saveDetails">${t.saveChanges}</button></div>
                </div></div>

            <div class="cw-card about-card"><h3>${t.pagesTitle}</h3>
                ${c.pages.length ? c.pages.map(pg => `<div class="set-item"><span>📄 ${esc(loc(pg, 'title'))}</span><button class="cw-btn cw-danger cw-sm" data-act="delPage" data-id="${pg.id}">${t.deleteBtn}</button></div>`).join('') : `<div class="cw-muted">${t.noPagesYet}</div>`}
                <div class="set-form">
                    <label>${t.pageTitle}<input class="cw-input" id="pgTitle" maxlength="40"></label>
                    <label>${t.pageBody}<textarea class="cw-input" id="pgBody"></textarea></label>
                    <div><button class="cw-btn" data-act="addPage">＋ ${t.addPage}</button></div>
                </div></div>

            <div class="cw-card about-card"><h3>${t.eventsTitle}</h3>
                ${evs.map(e => `<div class="set-item"><span>📅 ${esc(eventTitle(e, c))}</span><span class="cw-muted">${timeFmt.format(eventDate(e))}</span><button class="cw-btn cw-danger cw-sm" data-act="delEvent" data-id="${e.id}">${t.deleteBtn}</button></div>`).join('')}
                <div class="set-form">
                    <label>${t.eventTitleLbl}<input class="cw-input" id="evTitle" maxlength="60"></label>
                    <div class="set-row">
                        <label>${t.eventDayLbl}<select class="cw-input" id="evDay">${dayOpts}</select></label>
                        <label>${t.eventTimeLbl}<input class="cw-input" id="evTime" type="time" value="10:00"></label>
                    </div>
                    <label>${t.eventLocLbl}<input class="cw-input" id="evLoc" maxlength="60" placeholder="${esc(t.locOnline)}"></label>
                    <div><button class="cw-btn" data-act="addEvent">＋ ${t.addEvent}</button></div>
                </div></div>`;
    }

    function renderDetail() {
        const c = cById(state.cid);
        const tabs = [['feed', t.tabFeed], ['about', t.tabAbout], ['members', t.tabMembers], ['events', t.tabEvents], ['files', t.tabFiles],
            ...c.pages.map(pg => ['page:' + pg.id, loc(pg, 'title')]), ['settings', '⚙ ' + t.tabSettings]];
        let body;
        if (c.tab === 'feed') body = `<div class="det-layout"><div>${feedHtml(c)}</div><aside>${sideHtml(c)}</aside></div>`;
        else if (c.tab === 'about') body = aboutHtml(c);
        else if (c.tab === 'members') body = membersHtml(c);
        else if (c.tab === 'events') body = eventsHtml(c);
        else if (c.tab === 'files') body = filesHtml(c);
        else if (c.tab === 'settings') body = settingsHtml(c);
        else body = pageHtml(c);
        return `
            <button class="back-link" data-act="back">← ${t.back}</button>
            <div class="cw-card det-hero">
                <div class="det-cover" style="background:${coverBg(c)}"></div>
                <div class="det-bar">
                    <div class="det-icon">${c.icon}</div>
                    <div class="det-title"><h2>${esc(loc(c, 'name'))}</h2>${c.manager ? `<span class="cw-badge cw-primary">⚙ ${t.managerBadge}</span> ` : ''}<span class="cw-muted">${tr('members', { n: numFmt.format(memberCount(c)) })}</span></div>
                    <div class="det-actions">
                        ${c.joined ? `<button class="cw-btn cw-ghost cw-sm" data-act="notif" data-id="${c.id}">${c.notif ? '🔔 ' + t.notifOn : '🔕 ' + t.notifOff}</button>` : ''}
                        <button class="cw-btn cw-outline cw-sm" data-act="invite">＋ ${t.invite}</button>
                        <button class="cw-btn ${c.joined ? 'cw-outline' : ''}" data-act="toggleJoin" data-id="${c.id}">${c.joined ? '✓ ' + t.joined : t.join}</button>
                    </div>
                </div>
                <div class="det-tabs" role="tablist">${tabs.map(([k, lbl]) => `<button class="cw-tab ${c.tab === k ? 'cw-active' : ''}" role="tab" aria-selected="${c.tab === k}" data-act="tab" data-v="${k}">${esc(lbl)}</button>`).join('')}</div>
            </div>
            ${body}`;
    }

    function render() {
        document.getElementById('app').innerHTML = state.view === 'list' ? renderList() : renderDetail();
    }

    // --- Actions ---
    function findPost(id) {
        for (const c of COMMUNITIES) { const p = c.posts.find(x => x.id === id); if (p) return p; }
    }
    function requireJoin(c) {
        if (c.joined) return true;
        toast(t.joinToPost);
        return false;
    }

    const actions = {
        open(el) { state.calMonth = 0; state.calDay = null; state.view = 'detail'; state.cid = el.dataset.id; state.feedFilter = 'all'; state.day = null; state.mq = ''; render(); window.scrollTo(0, 0); },
        back() { state.view = 'list'; render(); },
        showCreate() {
            state.creating = !state.creating; render();
            const n = document.getElementById('newName'); if (n) n.focus();
        },
        createCommunity() {
            const input = document.getElementById('newName'), name = input.value.trim();
            if (!name) { input.focus(); return; }
            const c = { id: 'n' + (seed.n++), icon: '✨', grad: 'g' + (1 + Math.floor(Math.random() * 8)), cat: 'work', baseMembers: 0, joined: true, createdDaysAgo: 0,
                name, desc: t.newDesc, notif: true, visible: 4, tab: 'feed', posts: [], events: [], files: [], pages: [], removed: new Set(), manager: true };
            COMMUNITIES.unshift(c);
            state.creating = false; state.q = ''; state.cat = 'all';
            toast(tr('createdToast', { c: name }));
            actions.open({ dataset: { id: c.id } });
        },
        toggleManager() {
            const c = cById(state.cid); c.manager = !c.manager;
            toast(c.manager ? t.managerToastOn : t.managerToastOff); render();
        },
        saveDetails() {
            const c = cById(state.cid), n = document.getElementById('sName').value.trim(), d = document.getElementById('sDesc').value.trim();
            if (!n) { toast(t.fillRequired); return; }
            for (const sfx of ['', 'De', 'Fr', 'Es', 'Ja']) { c['name' + sfx] = n; c['desc' + sfx] = d; }
            toast(t.savedChanges); render();
        },
        addPage() {
            const c = cById(state.cid), ti = document.getElementById('pgTitle').value.trim(), b = document.getElementById('pgBody').value.trim();
            if (!ti || !b) { toast(t.fillRequired); return; }
            c.pages.push({ id: 'up' + (seed.n++), title: ti, body: b });
            toast(t.pageAdded); render();
        },
        delPage(el) {
            const c = cById(state.cid);
            c.pages = c.pages.filter(x => x.id !== el.dataset.id);
            if (c.tab === 'page:' + el.dataset.id) c.tab = 'settings';
            toast(t.pageDeleted); render();
        },
        addEvent() {
            const c = cById(state.cid), ti = document.getElementById('evTitle').value.trim();
            const [h, mi] = (document.getElementById('evTime').value || '10:00').split(':').map(Number);
            if (!ti) { toast(t.fillRequired); return; }
            const where = document.getElementById('evLoc').value.trim();
            c.events.push({ id: 'ue' + (seed.n++), day: Number(document.getElementById('evDay').value), h, min: mi, dur: 60, loc: 'locOnline', locText: where || undefined, going: 0, title: ti });
            toast(t.eventAdded); render();
        },
        delEvent(el) { const c = cById(state.cid); c.events = c.events.filter(x => x.id !== el.dataset.id); toast(t.eventDeleted); render(); },
        pin(el) { const p = findPost(el.dataset.id); p.pinned = !p.pinned; render(); },
        delPost(el) { const c = cById(state.cid); c.posts = c.posts.filter(x => x.id !== el.dataset.id); toast(t.postDeleted); render(); },
        removeMember(el) { cById(state.cid).removed.add(el.dataset.n); toast(tr('memberRemoved', { n: el.dataset.n })); render(); },
        calNav(el) { state.calMonth += Number(el.dataset.v); render(); },
        calDay(el) { state.calDay = state.calDay === el.dataset.k ? null : el.dataset.k; render(); },
        calEvent(el) {
            const c = cById(state.cid), e = c.events.find(x => x.id === el.dataset.id);
            c.tab = 'events'; state.day = e ? e.day : null; render(); window.scrollTo(0, 0);
        },
        goEvents() { cById(state.cid).tab = 'events'; state.day = null; render(); window.scrollTo(0, 0); },
        cat(el) { state.cat = el.dataset.v; render(); },
        toggleJoin(el) {
            const c = cById(el.dataset.id);
            c.joined = !c.joined;
            toast(tr(c.joined ? 'joinedToast' : 'leftToast', { c: loc(c, 'name') }));
            render();
        },
        tab(el) { cById(state.cid).tab = el.dataset.v; state.day = null; render(); },
        feedFilter(el) { state.feedFilter = el.dataset.v; cById(state.cid).visible = 4; render(); },
        showMore() { cById(state.cid).visible += 4; render(); },
        notif(el) { const c = cById(el.dataset.id); c.notif = !c.notif; toast(c.notif ? t.notifOnToast : t.notifOffToast); render(); },
        invite() { copyText(location.href); toast(t.inviteToast); },
        publish() {
            const c = cById(state.cid), ta = document.getElementById('composer');
            const txt = ta.value.trim();
            if (!txt) { ta.focus(); return; }
            c.posts.unshift({ id: 'u' + (seed.n++), type: 'discussion', author: ME, ts: new Date(), likes: 0, comments: [], text: txt });
            state.feedFilter = 'all';
            toast(t.postedToast);
            render();
        },
        like(el) { const id = el.dataset.id; liked.has(id) ? liked.delete(id) : liked.add(id); render(); },
        save(el) { const id = el.dataset.id; if (saved.has(id)) saved.delete(id); else { saved.add(id); toast(t.savedToast); } render(); },
        share(el) { copyText(location.href + '#post-' + el.dataset.id); toast(t.shareToast); },
        toggleComments(el) { const id = el.dataset.id; openComments.has(id) ? openComments.delete(id) : openComments.add(id); render(); },
        sendComment(el) {
            const c = cById(state.cid);
            if (!requireJoin(c)) return;
            const input = document.getElementById('ci-' + el.dataset.id);
            const txt = input.value.trim();
            if (!txt) { input.focus(); return; }
            findPost(el.dataset.id).comments.push({ a: ME, text: txt });
            render();
            const again = document.getElementById('ci-' + el.dataset.id);
            if (again) again.focus();
        },
        vote(el) {
            if (!requireJoin(cById(state.cid))) return;
            voted[el.dataset.id] = Number(el.dataset.i);
            render();
        },
        follow(el) { const n = el.dataset.n; followed.has(n) ? followed.delete(n) : followed.add(n); document.getElementById('mlist').innerHTML = membersListHtml(cById(state.cid)); },
        msg(el) { toast(tr('messageToast', { n: el.dataset.n })); },
        day(el) { const v = el.dataset.v; state.day = v === 'all' || state.day === Number(v) ? null : Number(v); render(); },
        rsvp(el) {
            const c = cById(state.cid);
            if (!requireJoin(c)) return;
            const id = el.dataset.id;
            if (rsvps.has(id)) { rsvps.delete(id); toast(t.ungoingToast); } else { rsvps.add(id); toast(t.goingToast); }
            render();
        },
        download(el) { toast(tr('downloadToast', { f: el.dataset.f })); },
    };

    document.addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        if (!el || !actions[el.dataset.act]) return;
        actions[el.dataset.act](el);
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.id === 'newName') { actions.createCommunity(); return; }
        if (e.key === 'Enter' && e.target.matches('.comment-form input')) {
            actions.sendComment({ dataset: { id: e.target.dataset.id } });
        } else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.comm-card')) {
            e.preventDefault();
            actions.open(e.target);
        }
    });
    document.addEventListener('input', e => {
        if (e.target.id === 'q') { state.q = e.target.value; document.getElementById('results').innerHTML = listResults(); }
        else if (e.target.id === 'mq') { state.mq = e.target.value; document.getElementById('mlist').innerHTML = membersListHtml(cById(state.cid)); }
    });

    document.addEventListener('DOMContentLoaded', () => {
        applySBBrand();
        render();
    });
</script>
