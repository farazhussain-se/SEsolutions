const t = T[LANG];

function tr(key, vars = {}) {
  let s = t[key] || key;
  for (const [k, v] of Object.entries(vars)) s = s.replace('${' + k + '}', v);
  return s;
}

const LANG_SUFFIX = { 'de': 'De', 'fr': 'Fr', 'es': 'Es', 'ja': 'Ja', 'en-GB': '', 'en-US': '' };
function loc(obj, key) {
  const suffix = LANG_SUFFIX[LANG] || '';
  return (suffix ? obj[key + suffix] : undefined) || obj[key];
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (t[k]) el.textContent = t[k]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.dataset.i18nPlaceholder; if (t[k]) el.placeholder = t[k]; });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { const k = el.dataset.i18nTitle; if (t[k]) { el.title = t[k]; el.setAttribute('aria-label', t[k]); } });
}

// — Runtime-anchored dates —
const now = new Date();
const minutesAgo = n => new Date(now.getTime() - n * 60000);
const hoursAgo = n => minutesAgo(n * 60);
const daysAgo = n => { const d = new Date(now); d.setDate(d.getDate() - n); return d; };
const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: 'auto' });
const dateFmt = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'short' });
function timeAgo(d) {
  const mins = Math.round((now - d) / 60000);
  if (mins < 1) return t.now;
  if (mins < 60) return rtf.format(-mins, 'minute');
  if (mins < 60 * 24) return rtf.format(-Math.round(mins / 60), 'hour');
  if (mins < 60 * 24 * 6) return rtf.format(-Math.round(mins / 1440), 'day');
  return dateFmt.format(d);
}

// — State —
const state = { stream: 'news', query: '', openComments: new Set([1]), liked: new Set(), commentLiked: new Set() };
POSTS.forEach(p => p.comments.forEach((c, i) => { c.id = p.id + '-' + i; }));

// — Helpers —
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => n.slice(0, 1).toUpperCase();
const person = n => PEOPLE[n] || { role: '', color: '#6b7280' };
const avatar = (n, sm) => `<div class="cw-avatar${sm ? ' sm' : ''}" style="background:${person(n).color}">${esc(initials(n))}</div>`;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

// — Rendering —
function renderTabs() {
  document.getElementById('tabs').innerHTML = STREAMS.map(s => {
    const n = POSTS.filter(p => p.stream === s.id).length;
    return `<button class="cw-tab${s.id === state.stream ? ' active' : ''}" role="tab" data-stream="${s.id}">${esc(loc(s, 'name'))}<span class="cw-tab-count">${n}</span></button>`;
  }).join('');
}

function renderHeader() {
  const s = STREAMS.find(x => x.id === state.stream);
  document.getElementById('streamIcon').textContent = s.icon;
  document.getElementById('streamName').textContent = loc(s, 'name');
  document.getElementById('streamMeta').textContent = tr('members', { n: new Intl.NumberFormat(LOCALE).format(s.members) });
}

function commentHTML(c) {
  const liked = state.commentLiked.has(c.id);
  const likeCount = (c.likes || 0) + (liked ? 1 : 0);
  return `<div class="cw-comment">${avatar(c.who, true)}
    <div class="cw-comment-bubble">
      <div class="cw-comment-name">${esc(c.who)}</div>
      <div class="cw-comment-text">${esc(c.mine ? c.text : loc(c, 'text'))}</div>
      <div class="cw-comment-meta"><span>${esc(c.mine ? t.now : timeAgo(c.when))}</span>
        <button class="cw-comment-like${liked ? ' liked' : ''}" data-clike="${c.id}">${esc(t.reply)}${likeCount ? ' · ' + likeCount : ''}</button></div>
    </div></div>`;
}

function postHTML(p) {
  const liked = state.liked.has(p.id);
  const likeCount = p.likes + (liked ? 1 : 0);
  const open = state.openComments.has(p.id);
  const pe = person(p.author);
  const role = pe.role ? ` <span class="cw-author-role">(${esc(loc(pe, 'role'))})</span>` : '';
  const title = p.mine ? p.title : loc(p, 'title');
  const text = p.mine ? p.text : loc(p, 'text');
  return `<article class="cw-post${p.pinned ? ' pinned' : ''}" data-id="${p.id}">
    ${p.pinned ? `<div class="cw-pin-banner">📌 ${esc(t.pinned)}</div>` : ''}
    <div class="cw-post-head">${avatar(p.author)}
      <div><div class="cw-author">${esc(p.author)}${role}</div><div class="cw-time">${esc(p.mine ? t.now : timeAgo(p.when))}</div></div></div>
    <div class="cw-post-body">${title ? `<h2 class="cw-post-title">${esc(title)}</h2>` : ''}<p class="cw-post-text">${esc(text)}</p></div>
    ${p.icon && !p.mine ? `<div class="cw-media" style="background:${p.mediaBg}">${p.icon}</div>` : ''}
    <div class="cw-post-stats">
      <span>${esc(tr('likes', { n: likeCount }))}</span><span>·</span><span>${esc(tr('commentCount', { n: p.comments.length }))}</span>
      <span class="cw-spacer"></span><span class="cw-seen">${esc(tr('seenBy', { n: new Intl.NumberFormat(LOCALE).format(p.seen + (liked ? 1 : 0)) }))}</span>
      <button class="cw-action" data-toggle="${p.id}" aria-label="${esc(t.comments)}" title="${esc(t.comments)}"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V5a1 1 0 011-1z"/></svg></button>
      <button class="cw-action${liked ? ' liked' : ''}" data-like="${p.id}" aria-label="${esc(t.like)}" title="${esc(t.like)}"><svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 21h9.4a2 2 0 001.9-1.4l2.5-7.5A2 2 0 0019.9 9H14l1-4.5a1.5 1.5 0 00-.4-1.4L13.5 2 8 8.5V21z"/></svg></button>
    </div>
    ${open ? `<div class="cw-comments">
      ${p.comments.length ? `<div class="cw-comments-label">${esc(t.comments)}</div>${p.comments.map(commentHTML).join('')}` : ''}
      <div class="cw-comment-form"><input type="text" data-cinput="${p.id}" placeholder="${esc(t.writeComment)}"><button class="cw-send" data-csend="${p.id}" disabled>${esc(t.send)}</button></div>
    </div>` : ''}
  </article>`;
}

function renderFeed() {
  const q = state.query.trim().toLowerCase();
  const list = POSTS.filter(p => p.stream === state.stream)
    .filter(p => !q || (loc(p, 'title') + ' ' + loc(p, 'text')).toLowerCase().includes(q) || (p.mine && (p.title + p.text).toLowerCase().includes(q)))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.when - a.when);
  document.getElementById('feed').innerHTML = list.length ? list.map(postHTML).join('') : `<div class="cw-empty">${esc(t.noPosts)}</div>`;
}

function render() { renderTabs(); renderHeader(); renderFeed(); }

// — Events —
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-stream]'); if (!b) return;
  state.stream = b.dataset.stream; render();
});

document.getElementById('searchBtn').addEventListener('click', () => {
  const box = document.getElementById('searchBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')) document.getElementById('searchInput').focus();
  else { state.query = ''; document.getElementById('searchInput').value = ''; renderFeed(); }
});
document.getElementById('searchInput').addEventListener('input', e => { state.query = e.target.value; renderFeed(); });

document.getElementById('feed').addEventListener('click', e => {
  const like = e.target.closest('[data-like]');
  if (like) { const id = +like.dataset.like; state.liked.has(id) ? state.liked.delete(id) : state.liked.add(id); renderFeed(); return; }
  const tog = e.target.closest('[data-toggle]');
  if (tog) { const id = +tog.dataset.toggle; state.openComments.has(id) ? state.openComments.delete(id) : state.openComments.add(id); renderFeed(); return; }
  const cl = e.target.closest('[data-clike]');
  if (cl) { const id = cl.dataset.clike; state.commentLiked.has(id) ? state.commentLiked.delete(id) : state.commentLiked.add(id); renderFeed(); return; }
  const send = e.target.closest('[data-csend]');
  if (send) addComment(+send.dataset.csend);
});

document.getElementById('feed').addEventListener('input', e => {
  const inp = e.target.closest('[data-cinput]'); if (!inp) return;
  inp.parentElement.querySelector('[data-csend]').disabled = !inp.value.trim();
});
document.getElementById('feed').addEventListener('keydown', e => {
  const inp = e.target.closest('[data-cinput]');
  if (inp && e.key === 'Enter' && inp.value.trim()) addComment(+inp.dataset.cinput);
});

function addComment(postId) {
  const inp = document.querySelector(`[data-cinput="${postId}"]`);
  const text = inp && inp.value.trim(); if (!text) return;
  const p = POSTS.find(x => x.id === postId);
  p.comments.push({ id: postId + '-' + p.comments.length, who: ME.name, text, mine: true, when: new Date(), likes: 0 });
  renderFeed();
  const again = document.querySelector(`[data-cinput="${postId}"]`); if (again) again.focus();
}

// Composer
const composer = document.getElementById('composer');
const newTitle = document.getElementById('newTitle'), newText = document.getElementById('newText'), postBtn = document.getElementById('composerPost');
const resetComposer = () => { composer.classList.remove('open'); newTitle.value = ''; newText.value = ''; postBtn.disabled = true; };
document.getElementById('composerOpen').addEventListener('click', () => { composer.classList.add('open'); newText.focus(); });
document.getElementById('composerCancel').addEventListener('click', resetComposer);
[newTitle, newText].forEach(el => el.addEventListener('input', () => { postBtn.disabled = !newText.value.trim(); }));
postBtn.addEventListener('click', () => {
  if (!newText.value.trim()) return;
  POSTS.push({ id: Date.now(), stream: state.stream, author: ME.name, when: new Date(), mine: true, seen: 1, likes: 0,
    title: newTitle.value.trim(), text: newText.value.trim(), comments: [] });
  resetComposer(); renderFeed(); toast(t.posted);
});

// — Init —
function init() {
  applyTranslations();
  const me = document.getElementById('meAvatar');
  me.textContent = initials(ME.name); me.style.background = ME.color;
  render();
}
document.addEventListener('DOMContentLoaded', init);
</script>
