<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="widget-name" content="Kerzner Book Leave">
<meta name="widget-description" content="Leave balance + a simple time-off request mockup for the Kerzner intranet quick links.">
<meta name="widget-tags" content="HR, Time Off, Kerzner">
<title>Book Leave</title>
<style>
    :root {
        --primary: #81191F; --primary-dark: #5e1216; --ink: #2a2423; --ink-light: #7a716e;
        --bg-gray: #f7f5f3; --border: #e9e3e0; --success: #2f7a4f; --success-bg: #ecf6ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: transparent; display: flex; justify-content: center; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 20px rgba(42,36,35,0.10); max-width: 420px; width: 100%; overflow: hidden; }
    .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 22px 24px; }
    .wordmark { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; letter-spacing: 1.5px; opacity: 0.9; margin-bottom: 8px; }
    .header h2 { font-size: 21px; font-weight: 600; margin: 0; }
    .balances { display: flex; gap: 10px; padding: 18px 24px 4px; }
    .balance-tile { flex: 1; background: var(--bg-gray); border-radius: 8px; padding: 12px 10px; text-align: center; }
    .balance-tile .num { font-size: 22px; font-weight: 700; color: var(--primary); }
    .balance-tile .label { font-size: 11px; color: var(--ink-light); margin-top: 2px; }
    .form { padding: 18px 24px 6px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .field select, .field input {
        width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px;
        font-size: 13px; color: var(--ink); font-family: inherit; background: #fff;
    }
    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }
    .submit-btn {
        width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px;
        border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    .submit-btn:active { background: var(--primary-dark); }
    .confirm {
        display: none; margin: 18px 24px 22px; padding: 14px; border-radius: 8px;
        background: var(--success-bg); color: var(--success); font-size: 13px; font-weight: 600; text-align: center;
    }
    .confirm.show { display: block; }
    .footer { background: var(--bg-gray); padding: 12px 24px; font-size: 11px; color: var(--ink-light); border-top: 1px solid var(--border); text-align: center; }
</style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="wordmark">kerzner</div>
        <h2>Book Leave</h2>
    </div>
    <div class="balances">
        <div class="balance-tile"><div class="num">14</div><div class="label">Annual days left</div></div>
        <div class="balance-tile"><div class="num">6</div><div class="label">Sick days left</div></div>
        <div class="balance-tile"><div class="num">2</div><div class="label">Pending requests</div></div>
    </div>
    <div class="form" id="formArea">
        <div class="field">
            <label>Leave type</label>
            <select id="leaveType">
                <option>Annual Leave</option>
                <option>Sick Leave</option>
                <option>Unpaid Leave</option>
                <option>Compassionate Leave</option>
            </select>
        </div>
        <div class="row">
            <div class="field">
                <label>From</label>
                <input type="date" id="fromDate">
            </div>
            <div class="field">
                <label>To</label>
                <input type="date" id="toDate">
            </div>
        </div>
        <div class="field">
            <label>Cover notes (optional)</label>
            <input type="text" placeholder="e.g. Shift covered by Davide">
        </div>
        <button class="submit-btn" id="submitBtn">Submit request</button>
    </div>
    <div class="confirm" id="confirm">&#10003; Request submitted &mdash; pending manager approval</div>
    <div class="footer">Synced with Workday Time Off</div>
</div>
<script>
    document.getElementById('submitBtn').addEventListener('click', function () {
        document.getElementById('formArea').style.display = 'none';
        document.getElementById('confirm').classList.add('show');
    });
</script>
</body>
</html>
