<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CarMax — My Shift</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: transparent;
  width: 100%;
  -webkit-font-smoothing: antialiased;
}

.widget {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(0, 30, 80, 0.10);
}

/* HEADER — CarMax navy with gold accent */
.header {
  background: linear-gradient(135deg, #00529F, #003c78);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid #FFD520;
}
.header-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.2px; }
.header-sub   { font-size: 11px; color: #bcd8ff; margin-top: 2px; font-weight: 500; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 213, 32, 0.18);
  border: 1px solid #FFD520;
  border-radius: 14px; padding: 4px 11px;
  font-size: 10px; font-weight: 800; color: #FFD520; letter-spacing: 0.5px;
}
.live-dot {
  width: 8px; height: 8px;
  background: #FFD520; border-radius: 50%;
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* location strip */
.loc-strip {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 18px;
  background: #f0f4fb;
  border-bottom: 1px solid #e3e9f3;
  font-size: 11px;
}
.loc-label { color: #57606a; font-weight: 600; }
.loc-value { color: #00529F; font-weight: 800; }

/* MAIN — today's shift card */
.main { padding: 16px 16px 4px; }

.section-label {
  font-size: 11px; font-weight: 800; color: #57606a;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin: 4px 0 8px 2px;
}

.advisor-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f6f8fa;
  border-radius: 10px;
  padding: 14px 16px;
  border-left: 5px solid #d0d7de;
  transition: background 0.2s;
  margin-bottom: 16px;
}
.advisor-card.on-shift { border-left-color: #1a9e3f; background: #dafbe1; }
.advisor-card.upcoming { border-left-color: #FFD520; background: #fff8dc; }
.advisor-card.off      { border-left-color: #8c959f; background: #f0f2f5; }

.advisor-name { font-size: 16px; font-weight: 800; color: #1b1f24; }
.advisor-role { font-size: 12px; color: #57606a; margin-top: 2px; }
.advisor-time { font-size: 12px; color: #57606a; margin-top: 6px; font-variant-numeric: tabular-nums; }

.status-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 0.4px;
  padding: 4px 10px; border-radius: 10px;
  color: #fff; white-space: nowrap;
}
.status-badge.on-badge  { background: #1a9e3f; }
.status-badge.up-badge  { background: #d18f00; }
.status-badge.off-badge { background: #8c959f; }

/* UPCOMING SHIFTS list */
.upcoming-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }

.shift-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f6f8fa;
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid #e8ecf0;
  gap: 10px;
}
.shift-row.swapped { opacity: 0.65; }

.shift-day   { font-size: 12px; font-weight: 800; color: #1b1f24; width: 62px; flex-shrink: 0; }
.shift-info  { flex: 1; min-width: 0; }
.shift-slot  { font-size: 12px; font-weight: 700; color: #1b1f24; }
.shift-bay   { font-size: 11px; color: #57606a; margin-top: 1px; }

.swap-btn {
  font-size: 11px; font-weight: 800; color: #00529F;
  background: #e8f0fc; border: 1px solid #c7dcf7;
  border-radius: 8px; padding: 6px 10px;
  cursor: pointer; white-space: nowrap;
  transition: background 0.15s;
}
.swap-btn:hover { background: #d6e6fb; }
.swap-pill {
  font-size: 10px; font-weight: 800; color: #d18f00;
  background: #fff3d6; border: 1px solid #ffe2a1;
  border-radius: 8px; padding: 6px 10px; white-space: nowrap;
}

/* FOOTER */
.footer {
  background: #f6f8fa;
  border-top: 1px solid #e8ecf0;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
}
.footer-src   { font-size: 10px; color: #8c959f; font-weight: 600; }
.footer-clock { font-size: 12px; font-weight: 800; color: #00529F; font-variant-numeric: tabular-nums; }

/* SWAP MODAL */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0, 20, 50, 0.45);
  align-items: center; justify-content: center;
  padding: 20px; z-index: 50;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff; width: 100%; max-width: 340px;
  border-radius: 14px; padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.modal-title { font-size: 15px; font-weight: 800; color: #1b1f24; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: #57606a; margin-bottom: 14px; }
.modal-label { font-size: 11px; font-weight: 700; color: #57606a; margin-bottom: 6px; display: block; }
.modal-select {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid #d0d7de; font-size: 13px; margin-bottom: 16px;
  color: #1b1f24; background: #fff;
}
.modal-actions { display: flex; gap: 8px; }
.modal-btn {
  flex: 1; padding: 10px; border-radius: 8px; border: none;
  font-size: 13px; font-weight: 800; cursor: pointer;
}
.modal-btn.cancel { background: #f0f2f5; color: #57606a; }
.modal-btn.confirm { background: #00529F; color: #fff; }
.modal-btn.confirm:hover { background: #003c78; }

@media (max-width: 380px) {
  .header-title { font-size: 15px; }
  .advisor-name { font-size: 15px; }
}
</style>
</head>
<body>
<div class="widget">

  <div class="header">
    <div>
      <div class="header-title">My Shift</div>
      <div class="header-sub" id="header-date">—</div>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>

  <div class="loc-strip">
    <span class="loc-label">Southeast Region · Service Center</span>
    <span class="loc-value">Atlanta, GA</span>
  </div>

  <div class="main">
    <div class="section-label">Today</div>
    <div class="advisor-card" id="advisor-card">
      <div>
        <div class="advisor-name">Patrick Reyes</div>
        <div class="advisor-role">Service Advisor</div>
        <div class="advisor-time" id="advisor-time">08:00 AM – 04:30 PM</div>
      </div>
      <div class="status-badge" id="status-badge"></div>
    </div>
    <div class="section-label">Upcoming</div>
  </div>

  <div class="upcoming-list" id="upcoming-list"></div>

  <div class="footer">
    <div class="footer-src">CarMax · Service Operations</div>
    <div class="footer-clock" id="footer-clock"></div>
  </div>

</div>

<div class="modal-overlay" id="swap-modal">
  <div class="modal-box">
    <div class="modal-title">Request Shift Swap</div>
    <div class="modal-sub" id="modal-sub">—</div>
    <label class="modal-label">Swap with colleague</label>
    <select class="modal-select" id="colleague-select">
      <option>Maria Chen</option>
      <option>Devon Brooks</option>
      <option>Alicia Ward</option>
      <option>Sam Patel</option>
    </select>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeSwapModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="confirmSwap()">Send Request</button>
    </div>
  </div>
</div>

<script>
// Patrick's shift window (24hr decimal hours)
const SHIFT_START = 8.0;   // 08:00 AM
const SHIFT_END   = 16.5;  // 04:30 PM
const SHIFT_LABEL  = '08:00 AM – 04:30 PM';

function getStatus(now) {
  const h = now.getHours() + now.getMinutes() / 60;
  if (h >= SHIFT_START && h < SHIFT_END) return 'on';
  if (h < SHIFT_START) return 'upcoming';
  return 'off';
}

function renderToday() {
  const now = new Date();
  const status = getStatus(now);

  const card = document.getElementById('advisor-card');
  card.classList.remove('on-shift', 'upcoming', 'off');

  const badge = document.getElementById('status-badge');
  badge.classList.remove('on-badge', 'up-badge', 'off-badge');

  if (status === 'on') {
    card.classList.add('on-shift');
    badge.classList.add('on-badge');
    badge.textContent = '● ON SHIFT';
  } else if (status === 'upcoming') {
    card.classList.add('upcoming');
    badge.classList.add('up-badge');
    badge.textContent = '▶ UPCOMING';
  } else {
    card.classList.add('off');
    badge.classList.add('off-badge');
    badge.textContent = 'OFF DUTY';
  }

  document.getElementById('advisor-time').textContent = SHIFT_LABEL;
}

// --- Upcoming shifts (next 4 workdays, anchored to today) ---
const now0 = new Date();
const daysFromNow = n => { const d = new Date(now0); d.setDate(d.getDate() + n); return d; };
const dayFmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

const UPCOMING = [
  { offset: 1, time: '08:00 AM – 04:30 PM', bay: 'Write-Up Desk' },
  { offset: 2, time: '10:00 AM – 06:30 PM', bay: 'Service Bay 3' },
  { offset: 4, time: '08:00 AM – 04:30 PM', bay: 'Write-Up Desk' },
  { offset: 5, time: '10:00 AM – 06:30 PM', bay: 'Service Bay 5' },
];

function renderUpcoming() {
  const list = document.getElementById('upcoming-list');
  list.innerHTML = '';
  UPCOMING.forEach((shift, i) => {
    const row = document.createElement('div');
    row.className = 'shift-row';
    row.id = 'shift-row-' + i;
    row.innerHTML = `
      <div class="shift-day">${dayFmt.format(daysFromNow(shift.offset))}</div>
      <div class="shift-info">
        <div class="shift-slot">${shift.time}</div>
        <div class="shift-bay">${shift.bay}</div>
      </div>
      <button class="swap-btn" onclick="openSwapModal(${i})">Request Swap</button>
    `;
    list.appendChild(row);
  });
}

// --- Swap modal ---
let activeSwapIndex = null;

function openSwapModal(i) {
  activeSwapIndex = i;
  const shift = UPCOMING[i];
  document.getElementById('modal-sub').textContent =
    `${dayFmt.format(daysFromNow(shift.offset))} · ${shift.time} · ${shift.bay}`;
  document.getElementById('swap-modal').classList.add('open');
}

function closeSwapModal() {
  document.getElementById('swap-modal').classList.remove('open');
  activeSwapIndex = null;
}

function confirmSwap() {
  if (activeSwapIndex === null) return;
  const colleague = document.getElementById('colleague-select').value;
  const row = document.getElementById('shift-row-' + activeSwapIndex);
  row.classList.add('swapped');
  const btn = row.querySelector('.swap-btn');
  const pill = document.createElement('div');
  pill.className = 'swap-pill';
  pill.textContent = 'Pending: ' + colleague;
  btn.replaceWith(pill);
  closeSwapModal();
}

function tick() {
  const now = new Date();
  document.getElementById('footer-clock').textContent =
    now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

renderToday();
renderUpcoming();
tick();
setInterval(tick, 1000);
setInterval(renderToday, 60 * 1000);
</script>
</body>
</html>
